<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Quản Lý & Trang Trí Phòng Trọ 3D High Quality</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #050505;
      overflow: hidden;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 20, 15, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
      margin-bottom: 25px;
      text-transform: uppercase;
      text-align: center;
    }
    .menu-btn {
      width: 230px;
      padding: 14px;
      margin: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #2ecc71;
      border-radius: 25px;
      background: #061a0e;
      color: #2ecc71;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
    }
    .menu-btn:active {
      transform: scale(0.95);
      background: #2ecc71;
      color: #000;
    }

    .modal-box {
      background: #0a1f12;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
      width: 90%;
      max-width: 380px;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #2ecc71;
      background: #020b05;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 600px;
      background: rgba(5, 20, 10, 0.9);
      border: 1.5px solid #2ecc71;
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .top-item {
      font-size: 12px;
      font-weight: bold;
      color: #e0e0e0;
    }
    .top-item span {
      color: #2ecc71;
    }

    .left-tools {
      position: absolute;
      top: 60px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      background: rgba(4, 18, 9, 0.9);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .customer-card {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 210px;
      background: rgba(4, 18, 9, 0.92);
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #2ecc71;
      backdrop-filter: blur(5px);
      z-index: 10;
      font-size: 12px;
    }
    .customer-card h3 {
      color: #f1c40f;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .customer-card p {
      margin-bottom: 3px;
      color: #dcdcdc;
    }
    
    .rent-btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .shop-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 650px;
      background: rgba(4, 15, 8, 0.94);
      padding: 8px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border: 1.5px solid #2ecc71;
      z-index: 10;
    }
    .item-btn {
      background: #082111;
      border: 1px solid #1e6b3c;
      color: #fff;
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .item-btn:active {
      transform: scale(0.92);
      background: #2ecc71;
      color: #000;
    }
    .item-btn span {
      color: #2ecc71;
      font-size: 9px;
    }
    .btn-clear {
      background: #3a0d0d !important;
      border-color: #8b0000 !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Màn hình Chào Đón -->
  <div id="welcome-screen" class="screen-overlay">
    <div class="welcome-title">🎮 GAME CỦA QUOCDAT</div>
    <button class="menu-btn" onclick="UI.openNaming()">▶️ CHƠI GAME</button>
    <button class="menu-btn" onclick="UI.openSettings()">⚙ CÀI ĐẶT ĐỒ HỌA</button>
  </div>

  <!-- Modal Đặt tên -->
  <div id="naming-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71;">TÊN KHU NHÀ TRỌ</h3>
      <input type="text" id="hostel-input" value="Trọ Cao Cấp QuocDat" maxlength="20">
      <button class="menu-btn" style="width:100%; margin:0;" onclick="UI.startGame()">VÀO QUẢN LÝ</button>
    </div>
  </div>

  <!-- Modal Cài Đặt Đồ Họa -->
  <div id="settings-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">⚙️ CÀI ĐẶT ĐỒ HỌA</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.setGraphics(true)">🔥 ĐỒ HỌA SIÊU NÉT (BÓNG MỀM)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0; background:#333; border-color:#666; color:#fff;" onclick="UI.setGraphics(false)">⚡ CHẾ ĐỘ MƯỢT TỐI ĐA</button>
      <button class="menu-btn" style="width:100%; margin-top:15px;" onclick="UI.closeSettings()">ĐÓNG</button>
    </div>
  </div>

  <!-- Modal Menu Chọn Phòng -->
  <div id="room-menu-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">🏠 MENU CHỌN PHÒNG</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('small')">📐 Phòng Chuẩn (4m x 4m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('long')">📐 Phòng Dài (4m x 7m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('large')">📐 Phòng Rộng (6m x 6m)</button>
      <button class="menu-btn" style="width:100%; margin-top:15px; background:#3a0d0d; border-color:#8b0000; color:#fff;" onclick="UI.closeRoomMenu()">HỦY</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-item">💰 <span id="money">20.000.000</span> đ</div>
    <div class="top-item">⭐ Cấp: <span id="level">1</span></div>
    <div class="top-item">📊 EXP: <span id="exp">0/100</span></div>
  </div>

  <!-- Left Tools -->
  <div class="left-tools">
    <button class="tool-btn" onclick="UI.openRoomMenu()">🏠 ĐỔI PHÒNG</button>
    <button class="tool-btn" onclick="UI.openSettings()">⚙️ ĐỒ HỌA</button>
  </div>

  <!-- Thẻ Khách Hàng -->
  <div class="customer-card">
    <h3>👤 KHÁCH THUÊ</h3>
    <p><b>Tên:</b> <span id="cust-name">---</span></p>
    <p><b>Ngân sách:</b> <span id="cust-budget" style="color:#2ecc71;">0 đ</span></p>
    <p><b>Giá phòng:</b> <span id="room-price" style="color:#f1c40f;">0 đ</span></p>
    <button class="rent-btn" onclick="UI.rentRoom()">🔑 GIAO PHÒNG CHO KHÁCH</button>
  </div>

  <!-- Bảng Decor -->
  <div class="shop-panel">
    <button class="item-btn" onclick="UI.buyItem('bed')">🛏 Giường Tầng <span>+500K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('desk')">💻 Bàn PC <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('ac')">❄️ Điều Hòa <span>+800K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('led')">🌈 Đèn LED RGB <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('fridge')">🧊 Tủ Lạnh <span>+600K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('plant')">🪴 Cây Cảnh <span>+200K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('dog')">🐶 Cún Cảnh <span>+300K giá phòng</span></button>
    <button class="item-btn btn-clear" onclick="UI.clearRoom()">🧹 Dọn Phòng <span>Xóa hết đồ</span></button>
  </div>

  <!-- Thư viện Three.js -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const player = { money: 20000000, level: 1, exp: 0, maxExp: 100 };
    let roomPrice = 0;
    let roomItems = [];
    let currentRoomType = 'small';
    let currentCustIndex = 0;

    const customers = [
      { name: "Nguyễn Văn Sinh (Sinh viên)", budget: 2500000 },
      { name: "Lê Thị Hoa (Kế toán)", budget: 3500000 },
      { name: "Trần Minh Tấn (Dev Gaming)", budget: 5500000 }
    ];

    const itemData = {
      bed: { cost: 1500000, rentPlus: 500000 },
      desk: { cost: 1200000, rentPlus: 400000 },
      ac: { cost: 2500000, rentPlus: 800000 },
      led: { cost: 600000, rentPlus: 400000 },
      fridge: { cost: 2000000, rentPlus: 600000 },
      plant: { cost: 300000, rentPlus: 200000 },
      dog: { cost: 1000000, rentPlus: 300000 }
    };

    const UI = {
      openNaming: () => {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('naming-modal').style.display = 'flex';
      },
      openSettings: () => { document.getElementById('settings-modal').style.display = 'flex'; },
      closeSettings: () => { document.getElementById('settings-modal').style.display = 'none'; },
      openRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'flex'; },
      closeRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'none'; },
      
      startGame: () => {
        document.getElementById('naming-modal').style.display = 'none';
        if (typeof THREE !== 'undefined') {
          init3D();
          createRoom('small');
        } else {
          alert("⚠️ Đang tải đồ họa 3D, vui lòng đợi vài giây!");
        }
        UI.loadCustomer();
        UI.updateUI();
      },

      setGraphics: (high) => {
        if (renderer) {
          renderer.shadowMap.enabled = high;
          renderer.shadowMap.type = high ? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
          renderer.setPixelRatio(high ? Math.min(window.devicePixelRatio, 2) : 1);
        }
        alert(high ? "🔥 Bật đồ họa siêu nét thành công!" : "⚡ Đã bật chế độ mượt!");
        UI.closeSettings();
      },

      buyItem: (type) => {
        if (roomItems.some(item => item.userData.type === type)) {
          alert("⚠️ Món đồ này đã có trong phòng!");
          return;
        }
        const item = itemData[type];
        if (player.money < item.cost) {
          alert("❌ Bạn không đủ tiền!");
          return;
        }
        player.money -= item.cost;
        roomPrice += item.rentPlus;
        
        if (scene) {
          const mesh = create3DModel(type);
          mesh.userData.type = type;
          scene.add(mesh);
          roomItems.push(mesh);
        }
        UI.updateUI();
      },

      clearRoom: () => {
        if (scene) {
          roomItems.forEach(item => scene.remove(item));
        }
        roomItems = [];
        roomPrice = 0;
        UI.updateUI();
      },

      changeRoomType: (type) => {
        currentRoomType = type;
        UI.clearRoom();
        if (scene) createRoom(type);
        UI.closeRoomMenu();
      },

      rentRoom: () => {
        const cust = customers[currentCustIndex];
        if (roomPrice === 0) { alert("⚠️ Phòng trống chưa trang trí!"); return; }

        if (roomPrice <= cust.budget) {
          const profit = 3000000;
          const totalIncome = roomPrice + profit;
          player.money += totalIncome;
          alert(`🎉 Giao phòng thành công cho ${cust.name}!\n💵 Thu về: +${totalIncome.toLocaleString('vi-VN')} đ`);
          UI.clearRoom();
          currentCustIndex = (currentCustIndex + 1) % customers.length;
          UI.loadCustomer();
        } else {
          alert("❌ Giá phòng quá đắt so với ngân sách của khách!");
        }
      },

      updateUI: () => {
        document.getElementById('money').innerText = player.money.toLocaleString('vi-VN');
        document.getElementById('level').innerText = player.level;
        document.getElementById('exp').innerText = `${player.exp}/${player.maxExp}`;
        document.getElementById('room-price').innerText = roomPrice.toLocaleString('vi-VN') + " đ";
      },

      loadCustomer: () => {
        const cust = customers[currentCustIndex];
        document.getElementById('cust-name').innerText = cust.name;
        document.getElementById('cust-budget').innerText = cust.budget.toLocaleString('vi-VN') + " đ";
      }
    };

    // HỆ THỐNG DỰNG MÔ HÌNH 3D CHI TIẾT SẮC NÉT (HIGH QUALITY LOW-POLY)
    function create3DModel(type) {
      const group = new THREE.Group();

      // Tiện ích tạo lưới bật bóng đổ tự động
      const createMesh = (geo, mat) => {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      };

      if (type === 'bed') { // GIƯỜNG TẦNG CHI TIẾT
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11, roughness: 0.6 });
        const matMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });
        const pillowMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.5 });
        const blanketMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 });

        // 4 Chân trụ chính
        const legGeo = new THREE.BoxGeometry(0.12, 3.2, 0.12);
        [[-0.95, -1.45], [0.95, -1.45], [-0.95, 1.45], [0.95, 1.45]].forEach(pos => {
          const leg = createMesh(legGeo, woodMat);
          leg.position.set(pos[0], 1.6, pos[1]);
          group.add(leg);
        });

        // Khung vạt giường tầng 1 & tầng 2
        [0.4, 2.1].forEach((yPos) => {
          const frame = createMesh(new THREE.BoxGeometry(2.0, 0.15, 3.0), woodMat);
          frame.position.set(0, yPos, 0);
          
          const mattress = createMesh(new THREE.BoxGeometry(1.85, 0.25, 2.85), matMat);
          mattress.position.set(0, yPos + 0.18, 0);

          const pillow = createMesh(new THREE.BoxGeometry(1.2, 0.12, 0.5), pillowMat);
          pillow.position.set(0, yPos + 0.32, -1.05);

          const blanket = createMesh(new THREE.BoxGeometry(1.86, 0.27, 1.6), blanketMat);
          blanket.position.set(0, yPos + 0.18, 0.5);

          group.add(frame, mattress, pillow, blanket);
        });

        // Thang leo
        for(let i=0; i<4; i++){
          const step = createMesh(new THREE.BoxGeometry(0.1, 0.05, 0.6), woodMat);
          step.position.set(0.95, 0.5 + i*0.45, -0.3);
          group.add(step);
        }

        group.position.set(-1.6, 0, -1.1);

      } else if (type === 'desk') { // BÀN GAMING PC CHI TIẾT
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const rgbMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 });
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, roughness: 0.5 });

        // Mặt bàn & Chân chữ Z
        const top = createMesh(new THREE.BoxGeometry(2.2, 0.08, 1.2), deskMat);
        top.position.set(0, 1.2, 0);
        
        const leg1 = createMesh(new THREE.BoxGeometry(0.1, 1.2, 1.0), deskMat);
        leg1.position.set(-1.0, 0.6, 0);
        const leg2 = leg1.clone(); leg2.position.x = 1.0;

        // Màn hình cong
        const monitor = createMesh(new THREE.BoxGeometry(1.6, 0.85, 0.06), screenMat);
        monitor.position.set(0, 1.75, -0.35);
        const stand = createMesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), deskMat);
        stand.position.set(0, 1.45, -0.35);

        // Bàn phím & Chuột
        const keyboard = createMesh(new THREE.BoxGeometry(0.8, 0.03, 0.3), rgbMat);
        keyboard.position.set(0, 1.25, 0.1);
        const mouse = createMesh(new THREE.BoxGeometry(0.12, 0.03, 0.18), rgbMat);
        mouse.position.set(0.6, 1.25, 0.1);

        // Case PC Led
        const pcCase = createMesh(new THREE.BoxGeometry(0.4, 0.8, 0.7), deskMat);
        pcCase.position.set(0.8, 1.6, -0.1);
        const pcLed = createMesh(new THREE.BoxGeometry(0.02, 0.7, 0.6), rgbMat);
        pcLed.position.set(0.6, 1.6, -0.1);

        // Ghế Gaming
        const seat = createMesh(new THREE.BoxGeometry(0.7, 0.1, 0.7), chairMat);
        seat.position.set(0, 0.6, 0.8);
        const back = createMesh(new THREE.BoxGeometry(0.7, 0.9, 0.1), chairMat);
        back.position.set(0, 1.05, 1.1);
        const chairLeg = createMesh(new THREE.CylinderGeometry(0.05, 0.3, 0.6, 8), deskMat);
        chairLeg.position.set(0, 0.3, 0.8);

        group.add(top, leg1, leg2, monitor, stand, keyboard, mouse, pcCase, pcLed, seat, back, chairLeg);
        group.position.set(1.5, 0, -1.1);

      } else if (type === 'ac') { // ĐIỀU HÒA CHI TIẾT
        const acMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const ledMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x2ecc71 });

        const body = createMesh(new THREE.BoxGeometry(1.8, 0.55, 0.45), acMat);
        const vent = createMesh(new THREE.BoxGeometry(1.6, 0.05, 0.35), blackMat);
        vent.position.set(0, -0.2, 0.02);
        const led = createMesh(new THREE.BoxGeometry(0.08, 0.08, 0.02), ledMat);
        led.position.set(0.7, -0.1, 0.23);

        group.add(body, vent, led);
        group.position.set(0, 3.1, -2.15);

      } else if (type === 'fridge') { // TỦ LẠNH 2 CÁNH
        const fridgeMat = new THREE.MeshStandardMaterial({ color: 0x34495e, metalness: 0.5, roughness: 0.3 });
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xbdc3c7, metalness: 0.8 });

        const body = createMesh(new THREE.BoxGeometry(1.1, 2.3, 1.1), fridgeMat);
        body.position.set(0, 1.15, 0);

        const handle1 = createMesh(new THREE.BoxGeometry(0.06, 0.5, 0.08), handleMat);
        handle1.position.set(0.45, 1.6, 0.58);
        const handle2 = createMesh(new THREE.BoxGeometry(0.06, 0.6, 0.08), handleMat);
        handle2.position.set(0.45, 0.7, 0.58);

        group.add(body, handle1, handle2);
        group.position.set(-1.8, 0, 1.6);

      } else if (type === 'plant') { // CÂY CẢNH DECOR CHI TIẾT
        const potMat = new THREE.MeshStandardMaterial({ color: 0xd35400, roughness: 0.8 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.6 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5e3a00, roughness: 0.9 });

        const pot = createMesh(new THREE.CylinderGeometry(0.45, 0.3, 0.8, 12), potMat);
        pot.position.y = 0.4;

        const trunk = createMesh(new THREE.CylinderGeometry(0.08, 0.1, 0.8, 8), woodMat);
        trunk.position.y = 1.0;

        const leaf1 = createMesh(new THREE.DodecahedronGeometry(0.5
