<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Quản Lý & Trang Trí Phòng Trọ 3D - QuocDat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #050505;
      overflow: hidden;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    /* Màn hình Chào đón & Popup */
    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 20, 15, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
      margin-bottom: 25px;
      text-transform: uppercase;
      text-align: center;
    }
    .menu-btn {
      width: 230px;
      padding: 14px;
      margin: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #2ecc71;
      border-radius: 25px;
      background: #061a0e;
      color: #2ecc71;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
    }
    .menu-btn:active {
      transform: scale(0.95);
      background: #2ecc71;
      color: #000;
    }

    /* Modal Đặt tên / Cài đặt / Chọn phòng */
    .modal-box {
      background: #0a1f12;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
      width: 90%;
      max-width: 380px;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #2ecc71;
      background: #020b05;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    /* HUD Top Bar */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 600px;
      background: rgba(5, 20, 10, 0.9);
      border: 1.5px solid #2ecc71;
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .top-item {
      font-size: 12px;
      font-weight: bold;
      color: #e0e0e0;
    }
    .top-item span {
      color: #2ecc71;
    }

    /* các nút tiện ích bên trái */
    .left-tools {
      position: absolute;
      top: 60px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      background: rgba(4, 18, 9, 0.9);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Thẻ Khách Hàng */
    .customer-card {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 210px;
      background: rgba(4, 18, 9, 0.92);
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #2ecc71;
      backdrop-filter: blur(5px);
      z-index: 10;
      font-size: 12px;
    }
    .customer-card h3 {
      color: #f1c40f;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .customer-card p {
      margin-bottom: 3px;
      color: #dcdcdc;
    }
    
    .rent-btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    /* Bảng Decor Nội Thất */
    .shop-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 650px;
      background: rgba(4, 15, 8, 0.94);
      padding: 8px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border: 1.5px solid #2ecc71;
      z-index: 10;
    }
    .item-btn {
      background: #082111;
      border: 1px solid #1e6b3c;
      color: #fff;
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .item-btn:active {
      transform: scale(0.92);
      background: #2ecc71;
      color: #000;
    }
    .item-btn span {
      color: #2ecc71;
      font-size: 9px;
    }
    .btn-clear {
      background: #3a0d0d !important;
      border-color: #8b0000 !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Màn hình Chào Đón -->
  <div id="welcome-screen" class="screen-overlay">
    <div class="welcome-title">🎮 GAME CỦA QUOCDAT</div>
    <button class="menu-btn" id="btn-play-game">▶️ CHƠI GAME</button>
    <button class="menu-btn" id="btn-settings">⚙️ CÀI ĐẶT ĐỒ HỌA</button>
  </div>

  <!-- Modal Đặt tên -->
  <div id="naming-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71;">TÊN KHU NHÀ TRỌ</h3>
      <input type="text" id="hostel-input" value="Trọ Cao Cấp QuocDat" maxlength="20">
      <button class="menu-btn" style="width:100%; margin:0;" id="btn-start-game">VÀO QUẢN LÝ</button>
    </div>
  </div>

  <!-- Modal Cài Đặt Đồ Họa -->
  <div id="settings-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">⚙️ CÀI ĐẶT ĐỒ HỌA</h3>
      <p style="margin-bottom: 15px; font-size: 13px;">Chế độ đồ họa bóng nét cao (High Graphics):</p>
      <button class="menu-btn" style="width:100%; margin:5px 0;" id="btn-high-gfx">🔥 BẬT ĐỒ HỌA SIÊU NÉT</button>
      <button class="menu-btn" style="width:100%; margin:5px 0; background:#333; border-color:#666; color:#fff;" id="btn-low-gfx">⚡ CHẾ ĐỘ TIẾT KIỆM</button>
      <button class="menu-btn" style="width:100%; margin-top:15px;" id="btn-close-settings">ĐÓNG</button>
    </div>
  </div>

  <!-- Modal Menu Chọn Phòng -->
  <div id="room-menu-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">🏠 MENU CHỌN PHÒNG</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('small')">📐 Phòng Nhỏ (4m x 4m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('long')">📐 Phòng Dài (4m x 8m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('large')">📐 Phòng Vuông Lớn (7m x 7m)</button>
      <button class="menu-btn" style="width:100%; margin-top:15px; background:#3a0d0d; border-color:#8b0000; color:#fff;" onclick="closeRoomMenu()">HỦY</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-item">💰 <span id="money">20.000.000</span> đ</div>
    <div class="top-item">⭐ Cấp: <span id="level">1</span></div>
    <div class="top-item">📊 EXP: <span id="exp">0/100</span></div>
  </div>

  <!-- Left Tools -->
  <div class="left-tools">
    <button class="tool-btn" onclick="openRoomMenu()">🏠 ĐỔI PHÒNG</button>
    <button class="tool-btn" onclick="openSettings()">⚙️ ĐỒ HỌA</button>
  </div>

  <!-- Thẻ Khách Hàng -->
  <div class="customer-card">
    <h3>👤 KHÁCH THUÊ</h3>
    <p><b>Tên:</b> <span id="cust-name">---</span></p>
    <p><b>Ngân sách:</b> <span id="cust-budget" style="color:#2ecc71;">0 đ</span></p>
    <p><b>Giá phòng:</b> <span id="room-price" style="color:#f1c40f;">0 đ</span></p>
    <button class="rent-btn" id="btnRent">🔑 GIAO PHÒNG CHO KHÁCH</button>
  </div>

  <!-- Bảng Decor -->
  <div class="shop-panel">
    <button class="item-btn" onclick="buyItem('bed')">
      🛏 Giường Tầng
      <span>+500K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('desk')">
      💻 Bàn PC + Ghế RGB
      <span>+400K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('ac')">
      ❄️ Điều Hòa
      <span>+800K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('led')">
      🌈 Đèn LED RGB
      <span>+400K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('fridge')">
      🧊 Tủ Lạnh
      <span>+600K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('plant')">
      🪴 Cây Cảnh
      <span>+200K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('dog')">
      🐶 Chú Cún Cảnh
      <span>+300K giá phòng</span>
    </button>
    <button class="item-btn btn-clear" onclick="clearRoom()">
      🧹 Dọn Phòng
      <span>Xóa hết đồ</span>
    </button>
  </div>

  <!-- Nạp Thư Viện Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // SỰ KIỆN NÚT BẤM GIAO DIỆN HỆ THỐNG
    document.getElementById('btn-play-game').addEventListener('click', openNamingModal);
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('btn-start-game').addEventListener('click', startGame);
    document.getElementById('btn-high-gfx').addEventListener('click', () => setGraphics(true));
    document.getElementById('btn-low-gfx').addEventListener('click', () => setGraphics(false));
    document.getElementById('btn-close-settings').addEventListener('click', closeSettings);

    function openNamingModal() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('naming-modal').style.display = 'flex';
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function openRoomMenu() { 
      document.getElementById('room-menu-modal').style.display = 'flex'; 
    }
    
    function closeRoomMenu() { 
      document.getElementById('room-menu-modal').style.display = 'none'; 
    }

    // KHỞI TẠO GAME STATE & THREE.JS
    let player = { money: 20000000, level: 1, exp: 0, maxExp: 100, hostelName: "Trọ QuocDat" };
    let roomPrice = 0;
    let roomItems = [];
    let ledLights = [];
    let currentRoomType = 'small';
    let currentRoomGroup = null;
    let customerNPC = null;

    const roomDimensions = {
      small: { w: 5, l: 5 },
      long: { w: 5, l: 9 },
      large: { w: 8, l: 8 }
    };

    const itemData = {
      bed: { cost: 1500000, rentPlus: 500000 },
      desk: { cost: 1200000, rentPlus: 400000 },
      ac: { cost: 2500000, rentPlus: 800000 },
      led: { cost: 600000, rentPlus: 400000 },
      fridge: { cost: 2000000, rentPlus: 600000 },
      plant: { cost: 300000, rentPlus: 200000 },
      dog: { cost: 1000000, rentPlus: 300000 }
    };

    const customers = [
      { name: "Nguyễn Văn Sinh (Sinh viên)", budget: 1500000 },
      { name: "Lê Thị Hoa (Kế toán)", budget: 2500000 },
      { name: "Trần Minh Tấn (Dev Gaming)", budget: 4000000 }
    ];
    let currentCustIndex = 0;

    let scene, camera, renderer, controls;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f0d);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(7, 7, 9);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.0);
      dirLight.position.set(6, 12, 6);
      dirLight.castShadow = true;
      scene.add(dirLight);

      animate();
    }

    function createRoom(type) {
      if (currentRoomGroup) scene.remove(currentRoomGroup);
      currentRoomGroup = new THREE.Group();

      const dim = roomDimensions[type];
      const floorGeo = new THREE.BoxGeometry(dim.w, 0.2, dim.l);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x6e4321, roughness: 0.2 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      currentRoomGroup.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0xe0ece4, roughness: 0.5 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(dim.w, 4, 0.2), wallMat);
      backWall.position.set(0, 2, -dim.l/2);
      backWall.receiveShadow = true;
      currentRoomGroup.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, dim.l), wallMat);
      leftWall.position.set(-dim.w/2, 2, 0);
      leftWall.receiveShadow = true;
      currentRoomGroup.add(leftWall);

      scene.add(currentRoomGroup);
    }

    function buyItem(type) {
      const item = itemData[type];
      if (player.money < item.cost) {
        alert("❌ Bạn không đủ tiền sắm món đồ này!");
        return;
      }
      player.money -= item.cost;
      roomPrice += item.rentPlus;

      let obj = new THREE.Group();
      if (type === 'bed') {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
        obj.add(frame);
        obj.position.set(-1.5, 0.2, -1);
      } else {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x2ecc71 }));
        obj.add(box);
        obj.position.set(0, 0.5, 0);
      }

      scene.add(obj);
      roomItems.push(obj);
      updateUI();
    }

    function clearRoom() {
      roomItems.forEach(item => scene.remove(item));
      roomItems = [];
      roomPrice = 0;
      updateUI();
    }

    function changeRoomType(type) {
      currentRoomType = type;
      clearRoom();
      createRoom(type);
      closeRoomMenu();
    }

    function setGraphics(high) {
      renderer.shadowMap.enabled = high;
      renderer.setPixelRatio(high ? Math.min(window.devicePixelRatio, 2) : 1);
      alert(high ? "🔥 Đã bật đồ họa nét cao!" : "⚡ Đã bật tiết kiệm pin!");
      closeSettings();
    }

    document.getElementById('btnRent').addEventListener('click', () => {
      const cust = customers[currentCustIndex];
      if (roomPrice === 0) { alert("⚠️ Phòng chưa decor!"); return; }

      if (roomPrice <= cust.budget) {
        const profit = 5000000;
        const totalIncome = roomPrice + profit;
        player.money += totalIncome;
        alert(`🎉 Cho thuê thành công!\n💵 Nhận tiền phòng: +${roomPrice.toLocaleString()} đ\n🎁 Tiền lời: +5.000.000 đ`);
        clearRoom();
        currentCustIndex = (currentCustIndex + 1) % customers.length;
        loadCustomer();
      } else {
        alert(`❌ Giá phòng vượt ngân sách khách!`);
      }
    });

    function updateUI() {
      document.getElementById('money').innerText = player.money.toLocaleString('vi-VN');
      document.getElementById('level').innerText = player.level;
      document.getElementById('exp').innerText = `${player.exp}/${player.maxExp}`;
      document.getElementById('room-price').innerText = roomPrice.toLocaleString('vi-VN') + " đ";
    }

    function loadCustomer() {
      const cust = customers[currentCustIndex];
      document.getElementById('cust-name').innerText = cust.name;
      document.getElementById('cust-budget').innerText = cust.budget.toLocaleString('vi-VN') + " đ";
    }

    function startGame() {
      document.getElementById('naming-modal').style.display = 'none';
      init3D();
      createRoom('small');
      loadCustomer();
      updateUI();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }
  </script>
</body>
  </html>
