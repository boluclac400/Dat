<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Quản Lý & Trang Trí Phòng Trọ 3D - QuocDat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #050505;
      overflow: hidden;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    /* Màn hình Chào đón & Popup */
    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 20, 15, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .welcome-title {
      font-size: 28px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
      margin-bottom: 25px;
      text-transform: uppercase;
      text-align: center;
    }
    .menu-btn {
      width: 230px;
      padding: 12px;
      margin: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #2ecc71;
      border-radius: 25px;
      background: #061a0e;
      color: #2ecc71;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
    }
    .menu-btn:active {
      transform: scale(0.95);
      background: #2ecc71;
      color: #000;
    }

    /* Modal Đặt tên / Cài đặt / Chọn phòng */
    .modal-box {
      background: #0a1f12;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
      width: 90%;
      max-width: 380px;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #2ecc71;
      background: #020b05;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    /* HUD Top Bar */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 600px;
      background: rgba(5, 20, 10, 0.9);
      border: 1.5px solid #2ecc71;
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .top-item {
      font-size: 12px;
      font-weight: bold;
      color: #e0e0e0;
    }
    .top-item span {
      color: #2ecc71;
    }

    /* Các nút tiện ích bên trái */
    .left-tools {
      position: absolute;
      top: 60px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      background: rgba(4, 18, 9, 0.9);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Thẻ Khách Hàng */
    .customer-card {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 220px;
      background: rgba(4, 18, 9, 0.92);
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #2ecc71;
      backdrop-filter: blur(5px);
      z-index: 10;
      font-size: 12px;
    }
    .customer-card h3 {
      color: #f1c40f;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .customer-card p {
      margin-bottom: 3px;
      color: #dcdcdc;
    }
    
    .rent-btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    /* Bảng Decor Nội Thất */
    .shop-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 650px;
      background: rgba(4, 15, 8, 0.94);
      padding: 8px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border: 1.5px solid #2ecc71;
      z-index: 10;
    }
    .item-btn {
      background: #082111;
      border: 1px solid #1e6b3c;
      color: #fff;
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .item-btn:active {
      transform: scale(0.92);
      background: #2ecc71;
      color: #000;
    }
    .item-btn span {
      color: #2ecc71;
      font-size: 9px;
    }
    .btn-clear {
      background: #3a0d0d !important;
      border-color: #8b0000 !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Màn hình Chào Đón -->
  <div id="welcome-screen" class="screen-overlay">
    <div class="welcome-title">🎮 GAME CỦA QUOCDAT</div>
    <button class="menu-btn" onclick="openNamingModal()">▶️ CHƠI GAME</button>
    <button class="menu-btn" onclick="openSettings()">⚙️ CÀI ĐẶT ĐỒ HỌA</button>
  </div>

  <!-- Modal Đặt tên -->
  <div id="naming-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71;">TÊN KHU NHÀ TRỌ</h3>
      <input type="text" id="hostel-input" value="Trọ Cao Cấp QuocDat" maxlength="20">
      <button class="menu-btn" style="width:100%; margin:0;" onclick="startGame()">VÀO QUẢN LÝ</button>
    </div>
  </div>

  <!-- Modal Cài Đặt Đồ Họa -->
  <div id="settings-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">⚙️ CÀI ĐẶT ĐỒ HỌA</h3>
      <p style="margin-bottom: 15px; font-size: 13px;">Chế độ đồ họa bóng nét cao (High Graphics):</p>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="setGraphics(true)">🔥 BẬT ĐỒ HỌA SIÊU NÉT</button>
      <button class="menu-btn" style="width:100%; margin:5px 0; background:#333; border-color:#666; color:#fff;" onclick="setGraphics(false)">⚡ CHẾ ĐỘ TIẾT KIỆM</button>
      <button class="menu-btn" style="width:100%; margin-top:15px;" onclick="closeSettings()">ĐÓNG</button>
    </div>
  </div>

  <!-- Modal Menu Chọn Phòng -->
  <div id="room-menu-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">🏠 MENU CHỌN PHÒNG</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('small')">📐 Phòng Nhỏ (4m x 4m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('long')">📐 Phòng Dài (4m x 8m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="changeRoomType('large')">📐 Phòng Vuông Lớn (7m x 7m)</button>
      <button class="menu-btn" style="width:100%; margin-top:15px; background:#3a0d0d; border-color:#8b0000; color:#fff;" onclick="closeRoomMenu()">HỦY</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-item">💰 <span id="money">20.000.000</span> đ</div>
    <div class="top-item">⭐ Cấp: <span id="level">1</span></div>
    <div class="top-item">📊 EXP: <span id="exp">0/100</span></div>
  </div>

  <!-- Left Tools -->
  <div class="left-tools">
    <button class="tool-btn" onclick="openRoomMenu()">🏠 ĐỔI PHÒNG</button>
    <button class="tool-btn" onclick="openSettings()">⚙️ ĐỒ HỌA</button>
  </div>

  <!-- Thẻ Khách Hàng -->
  <div class="customer-card">
    <h3>👤 KHÁCH THUÊ</h3>
    <p><b>Tên:</b> <span id="cust-name">---</span></p>
    <p><b>Ngân sách:</b> <span id="cust-budget" style="color:#2ecc71;">0 đ</span></p>
    <p><b>Giá phòng:</b> <span id="room-price" style="color:#f1c40f;">0 đ</span></p>
    <button class="rent-btn" id="btnRent">🔑 GIAO PHÒNG CHO KHÁCH</button>
  </div>

  <!-- Bảng Decor -->
  <div class="shop-panel">
    <button class="item-btn" onclick="buyItem('bed')">
      🛏 Giường Tầng
      <span>+500K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('desk')">
      💻 Bàn PC + Ghế RGB
      <span>+400K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('ac')">
      ❄️ Điều Hòa
      <span>+800K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('led')">
      🌈 Đèn LED RGB
      <span>+400K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('fridge')">
      🧊 Tủ Lạnh
      <span>+600K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('plant')">
      🪴 Cây Cảnh
      <span>+200K giá phòng</span>
    </button>
    <button class="item-btn" onclick="buyItem('dog')">
      🐶 Chú Cún Cảnh
      <span>+300K giá phòng</span>
    </button>
    <button class="item-btn btn-clear" onclick="clearRoom()">
      🧹 Dọn Phòng
      <span>Xóa hết đồ</span>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // GAME STATE
    let player = {
      money: 20000000,
      level: 1,
      exp: 0,
      maxExp: 100,
      hostelName: "Trọ QuocDat"
    };

    let roomPrice = 0;
    let roomItems = [];
    let ledLights = [];
    let currentRoomType = 'small';
    let currentRoomGroup = null;
    let customerNPC = null;
    let dogNPC = null;

    const roomDimensions = {
      small: { w: 5, l: 5 },
      long: { w: 5, l: 9 },
      large: { w: 8, l: 8 }
    };

    const itemData = {
      bed: { cost: 1500000, rentPlus: 500000 },
      desk: { cost: 1200000, rentPlus: 400000 },
      ac: { cost: 2500000, rentPlus: 800000 },
      led: { cost: 600000, rentPlus: 400000 },
      fridge: { cost: 2000000, rentPlus: 600000 },
      plant: { cost: 300000, rentPlus: 200000 },
      dog: { cost: 1000000, rentPlus: 300000 }
    };

    const customers = [
      { name: "Nguyễn Văn Sinh (Sinh viên)", budget: 1500000 },
      { name: "Lê Thị Hoa (Kế toán)", budget: 2500000 },
      { name: "Trần Minh Tấn (Dev Gaming)", budget: 4000000 }
    ];
    let currentCustIndex = 0;

    // THREE.JS SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f0d);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(7, 7, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // ÁNH SÁNG
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.0);
    dirLight.position.set(6, 12, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // DỰNG PHÒNG
    function createRoom(type) {
      if (currentRoomGroup) scene.remove(currentRoomGroup);
      currentRoomGroup = new THREE.Group();

      const dim = roomDimensions[type];
      const width = dim.w;
      const length = dim.l;

      // Sàn Gỗ
      const floorGeo = new THREE.BoxGeometry(width, 0.2, length);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x6e4321, roughness: 0.2, metalness: 0.1 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      currentRoomGroup.add(floor);

      // Tường
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xe0ece4, roughness: 0.5 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(width, 4, 0.2), wallMat);
      backWall.position.set(0, 2, -length/2);
      backWall.receiveShadow = true;
      currentRoomGroup.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, length), wallMat);
      leftWall.position.set(-width/2, 2, 0);
      leftWall.receiveShadow = true;
      currentRoomGroup.add(leftWall);

      // Cửa sổ 3D
      const windowFrameGeo = new THREE.BoxGeometry(2, 1.5, 0.1);
      const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x332211 });
      const windowFrame = new THREE.Mesh(windowFrameGeo, windowFrameMat);
      windowFrame.position.set(0, 2.3, -length/2 + 0.1);

      const glassGeo = new THREE.BoxGeometry(1.8, 1.3, 0.05);
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x88c0d0, transparent: true, opacity: 0.5, roughness: 0.1 });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      windowFrame.add(glass);

      currentRoomGroup.add(windowFrame);

      scene.add(currentRoomGroup);
      spawnCustomerNPC();
    }

    // TẠO NPC NGƯỜI
    function spawnCustomerNPC() {
      if (customerNPC) scene.remove(customerNPC);
      customerNPC = new THREE.Group();

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
      head.position.y = 1.6;
      customerNPC.add(head);

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.8), new THREE.MeshStandardMaterial({ color: 0x2980b9 }));
      body.position.y = 1.0;
      body.castShadow = true;
      customerNPC.add(body);

      const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x34495e }));
      legs.position.y = 0.3;
      customerNPC.add(legs);

      const dim = roomDimensions[currentRoomType];
      customerNPC.position.set(dim.w/2 - 1, 0, dim.l/2 - 1);
      customerNPC.rotation.y = -Math.PI / 4;
      scene.add(customerNPC);
    }

    // MUA ĐỒ
    function buyItem(type) {
      const item = itemData[type];
      if (player.money < item.cost) {
        alert("❌ Bạn không đủ tiền sắm món đồ này!");
        return;
      }

      player.money -= item.cost;
      roomPrice += item.rentPlus;

      let obj = new THREE.Group();

      if (type === 'bed') {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
        frame.castShadow = true;
        obj.add(frame);

        const mat = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.3, 2.8), new THREE.MeshStandardMaterial({ color: 0xff6b81 }));
        mat.position.y = 0.35;
        obj.add(mat);

        obj.position.set(-1.5, 0.2, -1);
      } 
      else if (type === 'desk') {
        const deskTop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 }));
        deskTop.position.y = 0.9;
        obj.add(deskTop);

        const monitorGeo = new THREE.BoxGeometry(0.8, 0.5, 0.05);
        const monitorMat = new THREE.MeshBasicMaterial({ color: 0x00d2d3 });
        const m1 = new THREE.Mesh(monitorGeo, monitorMat);
        m1.position.set(-0.4, 1.3, -0.2);
        const m2 = new THREE.Mesh(monitorGeo, monitorMat);
        m2.position.set(0.4, 1.3, -0.2);
        obj.add(m1); obj.add(m2);

        const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
        chairSeat.position.set(0, 0.5, 0.5);
        const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        chairBack.position.set(0, 0.9, 0.8);
        obj.add(chairSeat); obj.add(chairBack);

        obj.position.set(1.5, 0, -1.5);
      } 
      else if (type === 'ac') {
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        body.position.set(0, 3.2, -roomDimensions[currentRoomType].l/2 + 0.2);
        obj.add(body);
      } 
      else if (type === 'led') {
        const stripGeo = new THREE.BoxGeometry(4, 0.08, 0.08);
        const stripMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const strip = new THREE.Mesh(stripGeo, stripMat);
        obj.add(strip);

        const pointLight = new THREE.PointLight(0x00ffff, 2, 6);
        pointLight.position.set(0, -0.2, 0);
        obj.add(pointLight);

        obj.position.set(0, 3.8, -roomDimensions[currentRoomType].l/2 + 0.2);
        ledLights.push({ mesh: stripMat, light: pointLight });
      }
      else if (type === 'fridge') {
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2.2, 1), new THREE.MeshStandardMaterial({ color: 0x7bed9f, metalness: 0.3 }));
        body.position.set(-1.8, 1.1, 1.5);
        obj.add(body);
      }
      else if (type === 'plant') {
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xffa502 }));
        pot.position.y = 0.25;
        obj.add(pot);
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshStandardMaterial({ color: 0x2ed573 }));
        leaf.position.y = 0.65;
        obj.add(leaf);
        obj.position.set(1.8, 0, 1.8);
      }
      else if (type === 'dog') {
        dogNPC = new THREE.Group();
        const dogBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.6), new THREE.MeshStandardMaterial({ color: 0xe67e22 }));
        dogBody.position.y = 0.2;
        dogNPC.add(dogBody);
        const dogHead = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xd35400 }));
        dogHead.position.set(0, 0.4, -0.3);
        dogNPC.add(dogHead);
        
        dogNPC.position.set(0, 0, 0);
        obj.add(dogNPC);
      }

      scene.add(obj);
      roomItems.push(obj);
      updateUI();
    }

    function clearRoom() {
      roomItems.forEach(item => scene.remove(item));
      roomItems = [];
      ledLights = [];
      roomPrice = 0;
      updateUI();
    }

    // MENU PHÒNG & CÀI ĐẶT
    function openRoomMenu() { document.getElementById('room-menu-modal').style.display = 'flex'; }
    function closeRoomMenu() { document.getElementById('room-menu-modal').style.display = 'none'; }
    function changeRoomType(type) {
      currentRoomType = type;
      clearRoom();
      createRoom(type);
      closeRoomMenu();
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function setGraphics(high) {
      renderer.shadowMap.enabled = high;
      renderer.setPixelRatio(high ? Math.min(window.devicePixelRatio, 2) : 1);
      alert(high ? "🔥 Đã bật đồ họa siêu sắc nét & bóng mịn!" : "⚡ Đã bật tiết kiệm pin!");
      closeSettings();
    }

    // CHO KHÁCH THUÊ: CỘNG GIÁ PHÒNG + LỜI 5.000.000 Đ
    document.getElementById('btnRent').addEventListener('click', () => {
      const cust = customers[currentCustIndex];
      if (roomPrice === 0) { alert("⚠️ Phòng chưa decor gì cả!"); return; }

      if (roomPrice <= cust.budget) {
        const profit = 5000000; // Tiền lời cố định 5 triệu
        const totalIncome = roomPrice + profit; // Tổng
