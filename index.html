<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Quản Lý & Trang Trí Phòng Trọ 3D - Smooth Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #050505;
      overflow: hidden;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 20, 15, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
      margin-bottom: 25px;
      text-transform: uppercase;
      text-align: center;
    }
    .menu-btn {
      width: 230px;
      padding: 14px;
      margin: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #2ecc71;
      border-radius: 25px;
      background: #061a0e;
      color: #2ecc71;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
    }
    .menu-btn:active {
      transform: scale(0.95);
      background: #2ecc71;
      color: #000;
    }

    .modal-box {
      background: #0a1f12;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
      width: 90%;
      max-width: 380px;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #2ecc71;
      background: #020b05;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 600px;
      background: rgba(5, 20, 10, 0.9);
      border: 1.5px solid #2ecc71;
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .top-item {
      font-size: 12px;
      font-weight: bold;
      color: #e0e0e0;
    }
    .top-item span {
      color: #2ecc71;
    }

    .left-tools {
      position: absolute;
      top: 60px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      background: rgba(4, 18, 9, 0.9);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .customer-card {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 210px;
      background: rgba(4, 18, 9, 0.92);
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #2ecc71;
      backdrop-filter: blur(5px);
      z-index: 10;
      font-size: 12px;
    }
    .customer-card h3 {
      color: #f1c40f;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .customer-card p {
      margin-bottom: 3px;
      color: #dcdcdc;
    }
    
    .rent-btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .shop-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 650px;
      background: rgba(4, 15, 8, 0.94);
      padding: 8px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border: 1.5px solid #2ecc71;
      z-index: 10;
    }
    .item-btn {
      background: #082111;
      border: 1px solid #1e6b3c;
      color: #fff;
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .item-btn:active {
      transform: scale(0.92);
      background: #2ecc71;
      color: #000;
    }
    .item-btn span {
      color: #2ecc71;
      font-size: 9px;
    }
    .btn-clear {
      background: #3a0d0d !important;
      border-color: #8b0000 !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Màn hình Chào Đón -->
  <div id="welcome-screen" class="screen-overlay">
    <div class="welcome-title">🎮 GAME CỦA QUOCDAT</div>
    <button class="menu-btn" onclick="UI.openNaming()">▶️ CHƠI GAME</button>
  </div>

  <!-- Modal Đặt tên -->
  <div id="naming-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71;">TÊN KHU NHÀ TRỌ</h3>
      <input type="text" id="hostel-input" value="Trọ Cao Cấp QuocDat" maxlength="20">
      <button class="menu-btn" style="width:100%; margin:0;" onclick="UI.startGame()">VÀO QUẢN LÝ</button>
    </div>
  </div>

  <!-- Modal Menu Chọn Phòng -->
  <div id="room-menu-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">🏠 MENU CHỌN PHÒNG</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('small')">📐 Phòng Chuẩn (4m x 4m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('long')">📐 Phòng Dài (4m x 7m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('large')">📐 Phòng Rộng (6m x 6m)</button>
      <button class="menu-btn" style="width:100%; margin-top:15px; background:#3a0d0d; border-color:#8b0000; color:#fff;" onclick="UI.closeRoomMenu()">HỦY</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-item">💰 <span id="money">20.000.000</span> đ</div>
    <div class="top-item">⭐ Cấp: <span id="level">1</span></div>
    <div class="top-item">📊 EXP: <span id="exp">0/100</span></div>
  </div>

  <!-- Left Tools -->
  <div class="left-tools">
    <button class="tool-btn" onclick="UI.openRoomMenu()">🏠 ĐỔI PHÒNG</button>
  </div>

  <!-- Thẻ Khách Hàng -->
  <div class="customer-card">
    <h3>👤 KHÁCH THUÊ</h3>
    <p><b>Tên:</b> <span id="cust-name">---</span></p>
    <p><b>Ngân sách:</b> <span id="cust-budget" style="color:#2ecc71;">0 đ</span></p>
    <p><b>Giá phòng:</b> <span id="room-price" style="color:#f1c40f;">0 đ</span></p>
    <button class="rent-btn" onclick="UI.rentRoom()">🔑 GIAO PHÒNG CHO KHÁCH</button>
  </div>

  <!-- Bảng Decor -->
  <div class="shop-panel">
    <button class="item-btn" onclick="UI.buyItem('bed')">🛏 Giường Tầng <span>+500K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('desk')">💻 Bàn PC <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('ac')">❄️ Điều Hòa <span>+800K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('led')">🌈 Đèn LED RGB <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('fridge')">🧊 Tủ Lạnh <span>+600K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('plant')">🪴 Cây Cảnh <span>+200K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('dog')">🐶 Cún Cảnh <span>+300K giá phòng</span></button>
    <button class="item-btn btn-clear" onclick="UI.clearRoom()">🧹 Dọn Phòng <span>Xóa hết đồ</span></button>
  </div>

  <!-- Thư viện Three.js -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const player = { money: 20000000, level: 1, exp: 0, maxExp: 100 };
    let roomPrice = 0;
    let roomItems = [];
    let currentRoomType = 'small';
    let currentCustIndex = 0;

    const customers = [
      { name: "Nguyễn Văn Sinh (Sinh viên)", budget: 2500000 },
      { name: "Lê Thị Hoa (Kế toán)", budget: 3500000 },
      { name: "Trần Minh Tấn (Dev Gaming)", budget: 5500000 }
    ];

    const itemData = {
      bed: { cost: 1500000, rentPlus: 500000 },
      desk: { cost: 1200000, rentPlus: 400000 },
      ac: { cost: 2500000, rentPlus: 800000 },
      led: { cost: 600000, rentPlus: 400000 },
      fridge: { cost: 2000000, rentPlus: 600000 },
      plant: { cost: 300000, rentPlus: 200000 },
      dog: { cost: 1000000, rentPlus: 300000 }
    };

    const UI = {
      openNaming: () => {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('naming-modal').style.display = 'flex';
      },
      openRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'flex'; },
      closeRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'none'; },
      
      startGame: () => {
        document.getElementById('naming-modal').style.display = 'none';
        if (typeof THREE !== 'undefined') {
          init3D();
          createRoom('small');
        } else {
          alert("⚠️ Đang tải đồ họa 3D, vui lòng chờ trong giây lát!");
        }
        UI.loadCustomer();
        UI.updateUI();
      },

      buyItem: (type) => {
        if (roomItems.some(item => item.userData.type === type)) {
          alert("⚠️ Món đồ này đã có trong phòng!");
          return;
        }
        const item = itemData[type];
        if (player.money < item.cost) {
          alert("❌ Bạn không đủ tiền!");
          return;
        }
        player.money -= item.cost;
        roomPrice += item.rentPlus;
        
        if (scene) {
          const mesh = create3DModel(type);
          mesh.userData.type = type;
          scene.add(mesh);
          roomItems.push(mesh);
        }
        UI.updateUI();
      },

      clearRoom: () => {
        if (scene) {
          roomItems.forEach(item => scene.remove(item));
        }
        roomItems = [];
        roomPrice = 0;
        UI.updateUI();
      },

      changeRoomType: (type) => {
        currentRoomType = type;
        UI.clearRoom();
        if (scene) createRoom(type);
        UI.closeRoomMenu();
      },

      rentRoom: () => {
        const cust = customers[currentCustIndex];
        if (roomPrice === 0) { alert("⚠️ Phòng chưa được trang trí!"); return; }

        if (roomPrice <= cust.budget) {
          const profit = 3000000;
          const totalIncome = roomPrice + profit;
          player.money += totalIncome;
          alert(`🎉 Giao phòng thành công cho ${cust.name}!\n💵 Thu về: +${totalIncome.toLocaleString('vi-VN')} đ`);
          UI.clearRoom();
          currentCustIndex = (currentCustIndex + 1) % customers.length;
          UI.loadCustomer();
        } else {
          alert("❌ Giá phòng quá đắt so với ngân sách khách!");
        }
      },

      updateUI: () => {
        document.getElementById('money').innerText = player.money.toLocaleString('vi-VN');
        document.getElementById('level').innerText = player.level;
        document.getElementById('exp').innerText = `${player.exp}/${player.maxExp}`;
        document.getElementById('room-price').innerText = roomPrice.toLocaleString('vi-VN') + " đ";
      },

      loadCustomer: () => {
        const cust = customers[currentCustIndex];
        document.getElementById('cust-name').innerText = cust.name;
        document.getElementById('cust-budget').innerText = cust.budget.toLocaleString('vi-VN') + " đ";
      }
    };

    // MÔ HÌNH 3D NÂNG CẤP CHI TIẾT - TỐI ƯU SIÊU MƯỢT
    function create3DModel(type) {
      const group = new THREE.Group();

      const createMesh = (geo, mat) => {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      };

      if (type === 'bed') { // GIƯỜNG TẦNG CÓ NỆM GỐI CHĂN & THANG
        const woodMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
        const matMat = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 });
        const pillowMat = new THREE.MeshLambertMaterial({ color: 0x2980b9 });
        const blanketMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });

        // 4 Chân giường
        const legGeo = new THREE.BoxGeometry(0.12, 3.0, 0.12);
        [[-0.9, -1.4], [0.9, -1.4], [-0.9, 1.4], [0.9, 1.4]].forEach(pos => {
          const leg = createMesh(legGeo, woodMat);
          leg.position.set(pos[0], 1.5, pos[1]);
          group.add(leg);
        });

        // Tầng 1 & Tầng 2
        [0.4, 2.0].forEach((yPos) => {
          const frame = createMesh(new THREE.BoxGeometry(1.9, 0.12, 2.9), woodMat);
          frame.position.set(0, yPos, 0);
          
          const mattress = createMesh(new THREE.BoxGeometry(1.8, 0.2, 2.8), matMat);
          mattress.position.set(0, yPos + 0.15, 0);

          const pillow = createMesh(new THREE.BoxGeometry(1.1, 0.1, 0.5), pillowMat);
          pillow.position.set(0, yPos + 0.28, -1.0);

          const blanket = createMesh(new THREE.BoxGeometry(1.82, 0.22, 1.5), blanketMat);
          blanket.position.set(0, yPos + 0.16, 0.5);

          group.add(frame, mattress, pillow, blanket);
        });

        group.position.set(-1.6, 0, -1.1);

      } else if (type === 'desk') { // BÀN GAMING CÓ MÀN HÌNH, PHÍM RGB, CASE & GHẾ
        const deskMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
        const rgbMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        const screenMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const chairMat = new THREE.MeshLambertMaterial({ color: 0x8e44ad });

        // Bàn
        const top = createMesh(new THREE.BoxGeometry(2.1, 0.08, 1.1), deskMat);
        top.position.set(0, 1.2, 0);
        const leg1 = createMesh(new THREE.BoxGeometry(0.1, 1.2, 0.9), deskMat);
        leg1.position.set(-0.95, 0.6, 0);
        const leg2 = leg1.clone(); leg2.position.x = 0.95;

        // Màn hình
        const monitor = createMesh(new THREE.BoxGeometry(1.5, 0.8, 0.05), screenMat);
        monitor.position.set(0, 1.7, -0.3);
        const stand = createMesh(new THREE.BoxGeometry(0.2, 0.4, 0.2), deskMat);
        stand.position.set(0, 1.4, -0.3);

        // Bàn phím & Chuột
        const keyboard = createMesh(new THREE.BoxGeometry(0.7, 0.03, 0.25), rgbMat);
        keyboard.position.set(0, 1.24, 0.1);

        // Case PC Led
        const pcCase = createMesh(new THREE.BoxGeometry(0.35, 0.7, 0.6), deskMat);
        pcCase.position.set(0.75, 1.55, -0.1);

        // Ghế Gaming
        const seat = createMesh(new THREE.BoxGeometry(0.65, 0.1, 0.65), chairMat);
        seat.position.set(0, 0.6, 0.75);
        const back = createMesh(new THREE.BoxGeometry(0.65, 0.8, 0.1), chairMat);
        back.position.set(0, 1.0, 1.05);

        group.add(top, leg1, leg2, monitor, stand, keyboard, pcCase, seat, back);
        group.position.set(1.5, 0, -1.1);

      } else if (type === 'ac') { // ĐIỀU HÒA
        const acMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const blackMat = new THREE.MeshLambertMaterial({ color: 0x333333 });

        const body = createMesh(new THREE.BoxGeometry(1.7, 0.5, 0.4), acMat);
        const vent = createMesh(new THREE.BoxGeometry(1.5, 0.05, 0.3), blackMat);
        vent.position.set(0, -0.18, 0.02);

        group.add(body, vent);
        group.position.set(0, 3.1, -2.15);

      } else if (type === 'fridge') { // TỦ LẠNH 2 CÁNH
        const fridgeMat = new THREE.MeshLambertMaterial({ color: 0x34495e });
        const handleMat = new THREE.MeshLambertMaterial({ color: 0xbdc3c7 });

        const body = createMesh(new THREE.BoxGeometry(1.0, 2.2, 1.0), fridgeMat);
        body.position.set(0, 1.1, 0);

        const handle1 = createMesh(new THREE.BoxGeometry(0.05, 0.4, 0.06), handleMat);
        handle1.position.set(0.42, 1.5, 0.52);
        const handle2 = createMesh(new THREE.BoxGeometry(0.05, 0.5, 0.06), handleMat);
        handle2.position.set(0.42, 0.7, 0.52);

        group.add(body, handle1, handle2);
        group.position.set(-1.8, 0, 1.6);

      } else if (type === 'plant') { // CÂY CẢNH
        const potMat = new THREE.MeshLambertMaterial({ color: 0xd35400 });
        const leafMat = new THREE.MeshLambertMaterial({ color: 0x27ae60 });

        const pot = createMesh(new THREE.CylinderGeometry(0.4, 0.28, 0.7, 10), potMat);
        pot.position.y = 0.35;

        const leaf = createMesh(new THREE.DodecahedronGeometry(0.55), leafMat);
        leaf.position.y = 1.1;

        group.add(pot, leaf);
        group.position.set(1.8, 0, 1.8);

      } else if (type === 'dog') { // CHÚ CÚN 3D
        const dogMat = new THREE.MeshLambertMaterial({ color: 0xe67e22 });
        const darkMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });

        const body = createMesh(new THREE.BoxGeometry(0.4, 0.4, 0.7), dogMat);
        body.position.y = 0.35;

        const head = createMesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), dogMat);
        head.position.set(0, 0.65, 0.25);

        const nose = createMesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), darkMat);
        nose.position.set(0, 0.65, 0.43);

        group.add(body, head, nose);
        group.position.set(0, 0, 1.4);

      } else if (type === 'led') { // ĐỀN LED RGB
        const ledPoint = new THREE.PointLight(0x00ffff, 2, 6);
        ledPoint.position.set(0, 3.2, 0);

        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        bulb.position.set(0, 3.2, 0);

        group.add(ledPoint, bulb);
      }

      return group;
    }

    // KHỞI TẠO HỆ THỐNG THREE.JS SIÊU NHẸ VÀ MƯỢT
    let scene, camera, renderer, controls, roomGroup;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a120e);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 7.5, 9.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1); // Cố định pixel ratio nhẹ máy
      
      // BÓNG ĐỔ ĐƯỢC TỐI ƯU DUNG LƯỢNG
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.BasicShadowMap;

      container.appendChild(renderer.domElement);

      if (THREE.OrbitControls) {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
      }

      // ÁNH SÁNG MÔI TRƯỜNG
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
      mainLight.position.set(5, 8, 5);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 512; // Mức nhẹ nhất chống đơ
      mainLight.shadow.mapSize.height = 512;
      scene.add(mainLight);

      animate();
    }

    function createRoom(type) {
      if (roomGroup) scene.remove(roomGroup);
      roomGroup = new THREE.Group();

      let w = 5.2, d = 5.2;
      if (type === 'long') d = 7.0;
      if (type === 'large')
