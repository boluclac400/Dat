<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Quản Lý & Trang Trí Phòng Trọ 3D - QuocDat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #050505;
      overflow: hidden;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    .screen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 20, 15, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
      margin-bottom: 25px;
      text-transform: uppercase;
      text-align: center;
    }
    .menu-btn {
      width: 230px;
      padding: 14px;
      margin: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #2ecc71;
      border-radius: 25px;
      background: #061a0e;
      color: #2ecc71;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
    }
    .menu-btn:active {
      transform: scale(0.95);
      background: #2ecc71;
      color: #000;
    }

    .modal-box {
      background: #0a1f12;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
      width: 90%;
      max-width: 380px;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #2ecc71;
      background: #020b05;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 600px;
      background: rgba(5, 20, 10, 0.9);
      border: 1.5px solid #2ecc71;
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .top-item {
      font-size: 12px;
      font-weight: bold;
      color: #e0e0e0;
    }
    .top-item span {
      color: #2ecc71;
    }

    .left-tools {
      position: absolute;
      top: 60px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      background: rgba(4, 18, 9, 0.9);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .customer-card {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 210px;
      background: rgba(4, 18, 9, 0.92);
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #2ecc71;
      backdrop-filter: blur(5px);
      z-index: 10;
      font-size: 12px;
    }
    .customer-card h3 {
      color: #f1c40f;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .customer-card p {
      margin-bottom: 3px;
      color: #dcdcdc;
    }
    
    .rent-btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .shop-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 650px;
      background: rgba(4, 15, 8, 0.94);
      padding: 8px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border: 1.5px solid #2ecc71;
      z-index: 10;
    }
    .item-btn {
      background: #082111;
      border: 1px solid #1e6b3c;
      color: #fff;
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .item-btn:active {
      transform: scale(0.92);
      background: #2ecc71;
      color: #000;
    }
    .item-btn span {
      color: #2ecc71;
      font-size: 9px;
    }
    .btn-clear {
      background: #3a0d0d !important;
      border-color: #8b0000 !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Màn hình Chào Đón -->
  <div id="welcome-screen" class="screen-overlay">
    <div class="welcome-title">🎮 GAME CỦA QUOCDAT</div>
    <button class="menu-btn" onclick="UI.openNaming()">▶️ CHƠI GAME</button>
    <button class="menu-btn" onclick="UI.openSettings()">⚙️️ CÀI ĐẶT ĐỒ HỌA</button>
  </div>

  <!-- Modal Đặt tên -->
  <div id="naming-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71;">TÊN KHU NHÀ TRỌ</h3>
      <input type="text" id="hostel-input" value="Trọ Cao Cấp QuocDat" maxlength="20">
      <button class="menu-btn" style="width:100%; margin:0;" onclick="UI.startGame()">VÀO QUẢN LÝ</button>
    </div>
  </div>

  <!-- Modal Cài Đặt Đồ Họa -->
  <div id="settings-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">⚙️ CÀI ĐẶT ĐỒ HỌA</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.setGraphics(true)">🔥 BẬT ĐỒ HỌA SIÊU NÉT</button>
      <button class="menu-btn" style="width:100%; margin:5px 0; background:#333; border-color:#666; color:#fff;" onclick="UI.setGraphics(false)">⚡ CHẾ ĐỘ TIẾT KIỆM</button>
      <button class="menu-btn" style="width:100%; margin-top:15px;" onclick="UI.closeSettings()">ĐÓNG</button>
    </div>
  </div>

  <!-- Modal Menu Chọn Phòng -->
  <div id="room-menu-modal" class="screen-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="color: #2ecc71; margin-bottom: 15px;">🏠 MENU CHỌN PHÒNG</h3>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('small')">📐 Phòng Nhỏ (4m x 4m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('long')">📐 Phòng Dài (4m x 8m)</button>
      <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="UI.changeRoomType('large')">📐 Phòng Vuông Lớn (7m x 7m)</button>
      <button class="menu-btn" style="width:100%; margin-top:15px; background:#3a0d0d; border-color:#8b0000; color:#fff;" onclick="UI.closeRoomMenu()">HỦY</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-item">💰 <span id="money">20.000.000</span> đ</div>
    <div class="top-item">⭐ Cấp: <span id="level">1</span></div>
    <div class="top-item">📊 EXP: <span id="exp">0/100</span></div>
  </div>

  <!-- Left Tools -->
  <div class="left-tools">
    <button class="tool-btn" onclick="UI.openRoomMenu()">🏠 ĐỔI PHÒNG</button>
    <button class="tool-btn" onclick="UI.openSettings()">⚙️ ĐỒ HỌA</button>
  </div>

  <!-- Thẻ Khách Hàng -->
  <div class="customer-card">
    <h3>👤 KHÁCH THUÊ</h3>
    <p><b>Tên:</b> <span id="cust-name">---</span></p>
    <p><b>Ngân sách:</b> <span id="cust-budget" style="color:#2ecc71;">0 đ</span></p>
    <p><b>Giá phòng:</b> <span id="room-price" style="color:#f1c40f;">0 đ</span></p>
    <button class="rent-btn" onclick="UI.rentRoom()">🔑 GIAO PHÒNG CHO KHÁCH</button>
  </div>

  <!-- Bảng Decor -->
  <div class="shop-panel">
    <button class="item-btn" onclick="UI.buyItem('bed')">🛏 Giường Tầng <span>+500K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('desk')">💻 Bàn PC <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('ac')">❄️ Điều Hòa <span>+800K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('led')">🌈 Đèn LED RGB <span>+400K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('fridge')">🧊 Tủ Lạnh <span>+600K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('plant')">🪴 Cây Cảnh <span>+200K giá phòng</span></button>
    <button class="item-btn" onclick="UI.buyItem('dog')">🐶 Cún Cảnh <span>+300K giá phòng</span></button>
    <button class="item-btn btn-clear" onclick="UI.clearRoom()">🧹 Dọn Phòng <span>Xóa hết đồ</span></button>
  </div>

  <!-- Thư viện Three.js -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const player = { money: 20000000, level: 1, exp: 0, maxExp: 100 };
    let roomPrice = 0;
    let roomItems = [];
    let currentRoomType = 'small';
    let currentCustIndex = 0;

    const customers = [
      { name: "Nguyễn Văn Sinh (Sinh viên)", budget: 2500000 },
      { name: "Lê Thị Hoa (Kế toán)", budget: 3500000 },
      { name: "Trần Minh Tấn (Dev Gaming)", budget: 5000000 }
    ];

    const itemData = {
      bed: { cost: 1500000, rentPlus: 500000 },
      desk: { cost: 1200000, rentPlus: 400000 },
      ac: { cost: 2500000, rentPlus: 800000 },
      led: { cost: 600000, rentPlus: 400000 },
      fridge: { cost: 2000000, rentPlus: 600000 },
      plant: { cost: 300000, rentPlus: 200000 },
      dog: { cost: 1000000, rentPlus: 300000 }
    };

    const UI = {
      openNaming: () => {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('naming-modal').style.display = 'flex';
      },
      openSettings: () => { document.getElementById('settings-modal').style.display = 'flex'; },
      closeSettings: () => { document.getElementById('settings-modal').style.display = 'none'; },
      openRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'flex'; },
      closeRoomMenu: () => { document.getElementById('room-menu-modal').style.display = 'none'; },
      
      startGame: () => {
        document.getElementById('naming-modal').style.display = 'none';
        if (typeof THREE !== 'undefined') {
          init3D();
          createRoom('small');
        } else {
          alert("⚠️ Đang tải đồ họa 3D, vui lòng đợi vài giây!");
        }
        UI.loadCustomer();
        UI.updateUI();
      },

      setGraphics: (high) => {
        if (renderer) {
          renderer.shadowMap.enabled = high;
          renderer.setPixelRatio(high ? Math.min(window.devicePixelRatio, 2) : 1);
        }
        alert(high ? "🔥 Đã bật đồ họa nét cao!" : "⚡ Đã bật tiết kiệm pin!");
        UI.closeSettings();
      },

      buyItem: (type) => {
        if (roomItems.some(item => item.userData.type === type)) {
          alert("⚠️ Bạn đã trang trí món đồ này trong phòng rồi!");
          return;
        }
        const item = itemData[type];
        if (player.money < item.cost) {
          alert("❌ Bạn không đủ tiền!");
          return;
        }
        player.money -= item.cost;
        roomPrice += item.rentPlus;
        
        if (scene) {
          const mesh = create3DModel(type);
          mesh.userData.type = type;
          scene.add(mesh);
          roomItems.push(mesh);
        }
        UI.updateUI();
      },

      clearRoom: () => {
        if (scene) {
          roomItems.forEach(item => scene.remove(item));
        }
        roomItems = [];
        roomPrice = 0;
        UI.updateUI();
      },

      changeRoomType: (type) => {
        currentRoomType = type;
        UI.clearRoom();
        if (scene) createRoom(type);
        UI.closeRoomMenu();
      },

      rentRoom: () => {
        const cust = customers[currentCustIndex];
        if (roomPrice === 0) { alert("⚠️ Phòng chưa được trang trí!"); return; }

        if (roomPrice <= cust.budget) {
          const profit = 3000000;
          const totalIncome = roomPrice + profit;
          player.money += totalIncome;
          alert(`🎉 Giao phòng thành công cho ${cust.name}!\n💵 Thu tiền: +${totalIncome.toLocaleString('vi-VN')} đ`);
          UI.clearRoom();
          currentCustIndex = (currentCustIndex + 1) % customers.length;
          UI.loadCustomer();
        } else {
          alert("❌ Giá phòng vượt quá ngân sách của khách!");
        }
      },

      updateUI: () => {
        document.getElementById('money').innerText = player.money.toLocaleString('vi-VN');
        document.getElementById('level').innerText = player.level;
        document.getElementById('exp').innerText = `${player.exp}/${player.maxExp}`;
        document.getElementById('room-price').innerText = roomPrice.toLocaleString('vi-VN') + " đ";
      },

      loadCustomer: () => {
        const cust = customers[currentCustIndex];
        document.getElementById('cust-name').innerText = cust.name;
        document.getElementById('cust-budget').innerText = cust.budget.toLocaleString('vi-VN') + " đ";
      }
    };

    // HỆ THỐNG DỰNG MÔ HÌNH 3D CHI TIẾT
    function create3DModel(type) {
      const group = new THREE.Group();

      if (type === 'bed') { // GIƯỜNG TẦNG
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const matMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const pillowMat = new THREE.MeshStandardMaterial({ color: 0x3498db });

        // Khung giường
        const b1 = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 3.2), woodMat);
        b1.position.set(0, 0.3, 0);
        group.add(b1);

        const b2 = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 3.2), woodMat);
        b2.position.set(0, 2.2, 0);
        group.add(b2);

        // 4 Chân giường
        const legGeo = new THREE.BoxGeometry(0.15, 3.2, 0.15);
        [[-0.95, -1.5], [0.95, -1.5], [-0.95, 1.5], [0.95, 1.5]].forEach(pos => {
          const leg = new THREE.Mesh(legGeo, woodMat);
          leg.position.set(pos[0], 1.6, pos[1]);
          group.add(leg);
        });

        // Nệm & Gối
        const m1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.25, 3), matMat);
        m1.position.set(0, 0.5, 0);
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.6), pillowMat);
        p1.position.set(0, 0.65, -1.1);

        const m2 = m1.clone(); m2.position.y = 2.4;
        const p2 = p1.clone(); p2.position.y = 2.55;

        group.add(m1, p1, m2, p2);
        group.position.set(-1.8, 0, -1);

      } else if (type === 'desk') { // BÀN GAMING + MÀN HÌNH + GHẾ
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, emissive: 0x00d2d3, emissiveIntensity: 0.5 });
        const chairMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });

        // Mặt bàn & Chân
        const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 1.2), deskMat);
        top.position.set(0, 1.2, 0);
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 1.1), deskMat);
        legL.position.set(-1, 0.6, 0);
        const legR = legL.clone(); legR.position.x = 1;

        // Màn hình PC
        const monitor = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.08), screenMat);
        monitor.position.set(0, 1.7, -0.4);

        // Ghế
        const chair = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.8), chairMat);
        chair.position.set(0, 0.7, 0.8);

        group.add(top, legL, legR, monitor, chair);
        group.position.set(1.6, 0, -1);

      } else if (type === 'ac') { // ĐIỀU HÒA TREO TƯỜNG
        const acMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5 });
        const acBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.5), acMat);
        group.add(acBody);
        group.position.set(0, 3.2, -2.2);

      } else if (type === 'fridge') { // TỦ LẠNH 2 CÁNH
        const fridgeMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.3, 1.1), fridgeMat);
        body.position.set(0, 1.15, 0);
        group.add(body);
        group.position.set(-2, 0, 1.8);

      } else if (type === 'plant') { // CÂY CẢNH CHẬU TRÒN
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.7, 16), new THREE.MeshStandardMaterial({ color: 0xd35400 }));
        pot.position.y = 0.35;
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0x27ae60 }));
        leaf.position.y = 1.0;
        group.add(pot, leaf);
        group.position.set(2, 0, 2);

      } else if (type === 'dog') { // CHÚ CÚN
        const dogMat = new THREE.MeshStandardMaterial({ color: 0xf39c12 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.8), dogMat);
        body.position.y = 0.35;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), dogMat);
        head.position.set(0, 0.7, 0.3);
        group.add(body, head);
        group.position.set(0, 0, 1.5);

      } else if (type === 'led') { // DẢI ĐÈN LED RGB
        const light = new THREE.PointLight(0x00ffff, 2, 8);
        light.position.set(0, 3.5, 0);
        group.add(light);
      }

      return group;
    }

    // KHỞI TẠO ĐỒ HỌA THREE.JS
    let scene, camera, renderer, controls, roomGroup;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f0d);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      if (THREE.OrbitControls) {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
      }

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(6, 12, 6);
      scene.add(dirLight);

      animate();
    }

    function createRoom(type) {
      if (roomGroup) scene.remove(roomGroup);
      roomGroup = new THREE.Group();

      // Sàn gỗ
      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(5.5, 0.2, 5.5),
        new THREE.MeshStandardMaterial({ color: 0x8e5a2b, roughness: 0.4 })
      );
      floor.position.y = -0.1;

      // Tường sau
      const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(5.5, 3.5, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xecf0f1 })
      );
      backWall.position.set(0, 1.65, -2.75);

      // Tường trái
      const leftWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 3.5, 5.5),
        new THREE.MeshStandardMaterial({ color: 0xbdc3c7 })
      );
      leftWall.position.set(-2.75, 1.65, 0);

      roomGroup.add(floor, backWall, leftWall);
      scene.add(roomGroup);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }
  </script>
</body>
  </html>
